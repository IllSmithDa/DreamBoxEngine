name: DreamBox Engine - Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF

      - name: Build DreamBox Engine
        run: cmake --build build --config Release --parallel

      # Verify that CMake actually copied the font.
      - name: Verify Font
        shell: pwsh
        run: |
          $font = Get-ChildItem build -Recurse -Filter Montserrat-Regular.ttf |
            Select-Object -First 1

          if (-not $font) {
            Write-Host "Montserrat-Regular.ttf was not found."
            Write-Host "Build directory contents:"
            Get-ChildItem build -Recurse | Select-Object FullName
            throw "Font was not copied into the build output"
          }

          Write-Host "Font found:"
          Write-Host $font.FullName

      - name: Package Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $exe = Get-ChildItem build -Recurse -Filter DreamBoxEngine.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "DreamBoxEngine.exe not found"
          }

          Copy-Item $exe.FullName dist/

          $dll = Get-ChildItem build -Recurse -Filter SDL3.dll |
            Select-Object -First 1

          if (-not $dll) {
            throw "SDL3.dll not found"
          }

          Copy-Item $dll.FullName dist/

          # Copy the assets folder located beside DreamBoxEngine.exe.
          $assets = Join-Path $exe.DirectoryName "assets"

          if (-not (Test-Path $assets)) {
            throw "Assets folder not found beside DreamBoxEngine.exe"
          }

          Copy-Item `
            $assets `
            dist/assets `
            -Recurse

      - name: Show Package Contents
        shell: pwsh
        run: |
          Write-Host "Final DreamBox package:"
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: DreamBoxEngine-Windows
          path: dist/
          if-no-files-found: error